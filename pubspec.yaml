name: stack_wealth_news
description: "A new Flutter project."


publish_to: 'none'













version: 1.0.0+1

environment:
  sdk: ^3.7.2







dependencies:
  flutter:
    sdk: flutter

  
  
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.3
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  go_router: ^14.8.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  bloc_concurrency: ^0.3.0
  bloc: ^9.0.0
  webview_flutter: ^4.10.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  
  
  
  
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.3"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/kite_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21




flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env

  fonts:
    - family: Inter
      fonts:

        - asset: assets/fonts/Inter-Black.otf
        - asset: assets/fonts/Inter-BlackItalic.otf
          style: italic
        - asset: assets/fonts/Inter-Bold.otf
        - asset: assets/fonts/Inter-BoldItalic.otf
          style: italic
        - asset: assets/fonts/Inter-Light.otf
        - asset: assets/fonts/Inter-LightItalic.otf
          style: italic
        - asset: assets/fonts/Inter-Italic.otf
          style: italic
        - asset: assets/fonts/Inter-Thin.otf
        - asset: assets/fonts/Inter-ThinItalic.otf
          style: italic
        - asset: assets/fonts/Inter-Medium.otf
        - asset: assets/fonts/Inter-MediumItalic.otf
          style: italic
        - asset: assets/fonts/Inter-Regular.otf
  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
